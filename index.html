<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: sticky schematic map beside a filterable list on desktop; map above list on phones. */
:root {
  --bg: #EEF3F0;
  --surface: #FFFFFF;
  --ink: #11231C;
  --muted: #55695F;
  --line: #D0DCD5;
  --map: #E3ECE7;
  --river: #8DBCD9;
  --park: #C5DEC9;
  --sight: #0B7A4B;
  --sport: #D81B72;
  --food: #B86A00;
  --pin-ink: #FFFFFF;
  --focus: #11231C;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A15; --surface: #15281F; --ink: #E7F1EC; --muted: #9DB3A9; --line: #29443A;
    --map: #112119; --river: #2F6483; --park: #1B3A29;
    --sight: #3FD08B; --sport: #FF5FA2; --food: #F0A93B; --pin-ink: #0D1A15; --focus: #E7F1EC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A15; --surface: #15281F; --ink: #E7F1EC; --muted: #9DB3A9; --line: #29443A;
  --map: #112119; --river: #2F6483; --park: #1B3A29;
  --sight: #3FD08B; --sport: #FF5FA2; --food: #F0A93B; --pin-ink: #0D1A15; --focus: #E7F1EC;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; gap: 16px 24px; justify-content: space-between; align-items: flex-end; }
.title { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.badge { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; letter-spacing: .06em; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 6vw, 56px); line-height: 1; letter-spacing: -.02em; margin: 8px 0 8px; text-wrap: balance; }
h1 em { font-style: normal; color: var(--sport); }
.sub { color: var(--muted); max-width: 52ch; margin: 0; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 600; font-size: 13px; letter-spacing: .04em; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.controls { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; font-size: 12px; }

.main { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 900px) {
  .main { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
  .mapcol { position: sticky; top: 16px; }
}
.mapcol { min-width: 0; }
.mapbox { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--map); }
.mapbox svg { display: block; width: 100%; height: auto; }
.maplegend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 2px 0; font-size: 12.5px; color: var(--muted); }
.maplegend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.sight { background: var(--sight); } .dot.sport { background: var(--sport); } .dot.food { background: var(--food); }

.pin { cursor: pointer; }
.pin circle.body { stroke: var(--surface); stroke-width: 2.5; }
.pin.sight circle.body { fill: var(--sight); }
.pin.sport circle.body { fill: var(--sport); }
.pin.food circle.body { fill: var(--food); }
.pin text { fill: var(--pin-ink); font: 700 11px var(--body); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pin.dim { opacity: .22; }
.pin.sel circle.ring { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.pin circle.ring { fill: none; stroke: none; }
.pin:focus-visible circle.ring { stroke: var(--focus); stroke-width: 2.5; }
.pin:focus { outline: none; }
.maplabel rect { fill: var(--ink); }
.maplabel text { fill: var(--bg); font: 600 12px var(--body); dominant-baseline: central; }
.routeline { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 2 6; stroke-linecap: round; }
.geo-text { fill: var(--muted); font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; }
.scale line, .scale path { stroke: var(--muted); stroke-width: 2; fill: none; }
.scale text { fill: var(--muted); font: 600 11px var(--body); }

.listcol { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.routebar { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.routebar h2 { font-family: var(--display); font-size: 20px; margin: 0; letter-spacing: -.01em; }
.routebar p { margin: 0; color: var(--muted); font-size: 14px; }
.routebar button.copy { align-self: flex-start; margin-top: 4px; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }

.cards { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; cursor: pointer; scroll-margin-block: 12px; }
.card.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.card .num { grid-row: 1 / span 3; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--pin-ink); font-variant-numeric: tabular-nums; }
.card.noroute { grid-template-columns: minmax(0, 1fr) auto; }
.num.sight { background: var(--sight); } .num.sport { background: var(--sport); } .num.food { background: var(--food); }
.card .tag { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.tag.sight { color: var(--sight); } .tag.sport { color: var(--sport); } .tag.food { color: var(--food); }
.card h3 { font-family: var(--display); font-size: 19px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.card p { margin: 2px 0 0; color: var(--muted); }
.card .meta { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.card .meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.heart { grid-column: -2; grid-row: 1 / span 2; align-self: start; border: 1px solid var(--line); background: transparent; border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; }
.heart svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2; }
.heart[aria-pressed="true"] svg { fill: var(--sport); stroke: var(--sport); }
.maplink { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--ink); text-underline-offset: 3px; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 24px; color: var(--muted); text-align: center; }

footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
footer b { color: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .pin, .card { transition: opacity .15s, border-color .15s; }
}
</style>

</head>

    $("h1").innerHTML = s.h1; $("sub").textContent = s.sub;
    $("foot1").innerHTML = s.foot1; $("foot2").textContent = s.foot2;
    $("lang-es").setAttribute("aria-pressed", lang === "es"); $("lang-en").setAttribute("aria-pressed", lang === "en");
    $("legend").innerHTML = CATS.map(function (c) { return '<span><i class="dot ' + c + '"></i>' + s.cat[c] + "</span>"; }).join("");
  }

  function renderControls() {
    var s = t();
    $("chips").innerHTML = FILTERS.map(function (f) {
      var on = route === "none" && filter === f;
      return '<button type="button" class="chip" data-f="' + f + '" aria-pressed="' + on + '">' + s.f[f] + ' <span class="n">' + count(f) + "</span></button>";
    }).join("");
    $("routes").innerHTML = '<span class="label">' + s.routes + "</span>" +
      '<button type="button" class="chip" data-r="none" aria-pressed="' + (route === "none") + '">' + s.noroute + "</button>" +
      Object.keys(ROUTES).map(function (k) {
        return '<button type="button" class="chip" data-r="' + k + '" aria-pressed="' + (route === k) + '">' + ROUTES[k].name[lang] + "</button>";
      }).join("");
  }

  function renderMap() {
    var s = t(), h = "";
    h += '<rect width="700" height="500" fill="var(--map)"/>';
    h += '<ellipse cx="' + X(14.4975).toFixed(0) + '" cy="' + ((46.070 - 46.0555) * 16650).toFixed(0) + '" rx="46" ry="92" fill="var(--park)"/>';
    h += '<ellipse cx="' + X(14.5085).toFixed(0) + '" cy="' + Y(46.0489).toFixed(0) + '" rx="46" ry="36" fill="var(--park)"/>';
    h += '<path d="' + smooth(RIVER) + '" fill="none" stroke="var(--river)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>';
    h += '<text class="geo-text" x="' + (X(14.5190) + 6).toFixed(0) + '" y="' + (Y(46.0540) - 14).toFixed(0) + '">' + s.river + "</text>";
    h += '<text class="geo-text" x="' + (X(14.4975) - 24).toFixed(0) + '" y="' + (Y(46.0600) - 4).toFixed(0) + '">' + s.park + "</text>";
    h += '<text class="geo-text" x="' + (X(14.5085) - 22).toFixed(0) + '" y="' + (Y(46.0489) + 52).toFixed(0) + '">' + s.hill + "</text>";
    if (route !== "none") {
      var pts = ROUTES[route].stops.map(function (st) { var p = byId[st[0]]; return X(p.lon).toFixed(1) + "," + Y(p.lat).toFixed(1); });
      h += '<polyline class="routeline" points="' + pts.join(" ") + '"/>';
    }
    P.forEach(function (p) {
      var x = X(p.lon), y = Y(p.lat), ri = routeIndex(p.id);
      var cls = "pin " + p.cat + (visible(p) ? "" : " dim") + (sel === p.id ? " sel" : "");
      h += '<g class="' + cls + '" data-id="' + p.id + '" tabindex="0" role="button" aria-label="' + p.name[lang] + '" transform="translate(' + x.toFixed(1) + " " + y.toFixed(1) + ')">' +
        '<circle class="ring" r="15"/><circle class="body" r="11"/>' + (ri >= 0 ? "<text>" + (ri + 1) + "</text>" : "") + "</g>";
    });
    if (sel) {
      var p = byId[sel], x = X(p.lon), y = Y(p.lat), name = p.name[lang], w = name.length * 6.6 + 18;
      var lx = x + 18; if (lx + w > 692) lx = x - 18 - w;
      var ly = Math.max(14, Math.min(486, y));
      h += '<g class="maplabel" pointer-events="none"><rect x="' + lx.toFixed(1) + '" y="' + (ly - 12).toFixed(1) + '" width="' + w.toFixed(1) + '" height="24" rx="6"/><text x="' + (lx + 9).toFixed(1) + '" y="' + ly.toFixed(1) + '">' + name + "</text></g>";
    }
    h += '<g class="scale" transform="translate(20 474)"><path d="M0 -6 V0 H150 V-6"/><text x="0" y="-12">' + s.scale + "</text></g>";
    $("map").setAttribute("aria-label", s.map);
    $("map").innerHTML = h;
  }

  function renderList() {
    var s = t(), list;
    if (route !== "none") {
      var r = ROUTES[route];
      list = r.stops.map(function (st) { return byId[st[0]]; });
      $("routebar").innerHTML = '<div class="routebar"><h2>' + r.name[lang] + "</h2><p>" + r.desc[lang] + " · " + r.stops.length + " " + s.stops + '</p><button type="button" class="copy" id="copy">' + s.copy + "</button></div>";
    } else {
      list = P.filter(visible);
      $("routebar").innerHTML = "";
    }
    if (!list.length) {
      $("cards").innerHTML = '<li class="empty">' + (filter === "saved" ? s.empty : s.emptyF) + "</li>";
      return;
    }
    $("cards").innerHTML = list.map(function (p, i) {
      var ri = routeIndex(p.id), time = ri >= 0 ? ROUTES[route].stops[ri][1] : null;
      var on = !!saved[p.id];
      return '<li class="card' + (ri < 0 ? " noroute" : "") + (sel === p.id ? " sel" : "") + '" id="card-' + p.id + '" data-id="' + p.id + '">' +
        (ri >= 0 ? '<div class="num ' + p.cat + '">' + (ri + 1) + "</div>" : "") +
        '<div style="min-width:0"><div class="tag ' + p.cat + '">' + s.cat[p.cat] + (time ? " · " + time : "") + "</div>" +
        "<h3>" + p.name[lang] + "</h3><p>" + p.tip[lang] + "</p>" +
        '<div class="meta"><span>' + s.price + ": <b>" + p.price[lang] + "</b></span><span>" + s.dur + ": <b>" + p.time[lang] + "</b></span></div>" +
        '<a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + p.lat + "," + p.lon + '">' + s.maps + " ↗</a></div>" +
        '<button type="button" class="heart" data-save="' + p.id + '" aria-pressed="' + on + '" aria-label="' + (on ? s.unsave : s.save) + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg></button></li>';
    }).join("");
  }

  function renderAll() { renderStatic(); renderControls(); renderMap(); renderList(); }

  function select(id, scroll) {
    sel = sel === id && !scroll ? null : id;
    renderMap(); renderList();
    if (scroll) {
      var el = $("card-" + id);
      if (el) el.scrollIntoView({ block: "nearest", behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
  }

  // ---------- events ----------
  $("lang-es").addEventListener("click", function () { lang = "es"; try { localStorage.setItem("ljg-lang", lang); } catch (e) {} renderAll(); });
  $("lang-en").addEventListener("click", function () { lang = "en"; try { localStorage.setItem("ljg-lang", lang); } catch (e) {} renderAll(); });

  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-f]"); if (!b) return;
    filter = b.getAttribute("data-f"); route = "none"; sel = null; renderControls(); renderMap(); renderList();
  });
  $("routes").addEventListener("click", function (e) {
    var b = e.target.closest("[data-r]"); if (!b) return;
    route = b.getAttribute("data-r"); sel = null; renderControls(); renderMap(); renderList();
  });
  $("map").addEventListener("click", function (e) {
    var g = e.target.closest(".pin"); if (g) select(g.getAttribute("data-id"), true);
  });
  $("map").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var g = e.target.closest(".pin"); if (g) { e.preventDefault(); select(g.getAttribute("data-id"), true); }
  });
  $("cards").addEventListener("click", function (e) {
    var h = e.target.closest("[data-save]");
    if (h) {
      var id = h.getAttribute("data-save");
      if (saved[id]) delete saved[id]; else saved[id] = 1;
      try { localStorage.setItem("ljg-saved", JSON.stringify(saved)); } catch (err) {}
      renderControls(); renderList(); return;
    }
    var c = e.target.closest(".card"); if (c) select(c.getAttribute("data-id"), false);
  });
  $("routebar").addEventListener("click", function (e) {
    var b = e.target.closest("#copy"); if (!b) return;
    var r = ROUTES[route];
    var text = r.name[lang] + "\n" + r.stops.map(function (st, i) { return (i + 1) + ". " + st[1] + " " + byId[st[0]].name[lang]; }).join("\n");
    var done = function () { b.textContent = t().copied; setTimeout(function () { b.textContent = t().copy; }, 1500); };
    try { navigator.clipboard.writeText(text).then(done, function () {}); } catch (err) {}
  });

  renderAll();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
}
</script>
</body>
</html>
